name: CI

on:
  push:
    branches: [develop, main, "feature/**"]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run api:generate:verify
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build
      - run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Test fail-closed history scanning
        run: ./scripts/test-secret-history.sh
      - name: Scan complete Git history
        run: ./scripts/verify-secret-history.sh

  container:
    runs-on: ubuntu-latest
    needs: [verify, secrets]
    steps:
      - uses: actions/checkout@v6
      - name: Build and verify hardened runtime image
        run: ./scripts/verify-container.sh job-seeker-copilot-client:ci
      - name: Scan runtime image for Critical and High vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: job-seeker-copilot-client:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          scanners: vuln
          vuln-type: os,library
          version: v0.72.0
